<script>

/* =========================
   ✅ only-added: DynGamma integration helpers
========================= */
function openDynGamma(){
  const mainGrid = document.querySelector('.grid');
  const dynView  = document.getElementById('dyngamma_view');
  const dynBtn   = document.getElementById('btn-dyngamma');

  // hide A view, show DynGamma
  if(mainGrid) mainGrid.classList.add('hidden');
  if(dynView)  dynView.classList.remove('hidden');

  // active tab style
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  dynBtn.classList.add('active');

  // load iframe srcdoc once
  const iframe = document.getElementById('dyngamma_iframe');
  if(iframe && !iframe.srcdoc){
    const tpl = document.getElementById('dyngamma_tpl');
    iframe.srcdoc = tpl ? tpl.innerHTML : '<!doctype html><html><body>DynGamma template missing.</body></html>';
  }
}

function closeDynGammaIfOpen(){
  const mainGrid = document.querySelector('.grid');
  const dynView  = document.getElementById('dyngamma_view');
  if(dynView && !dynView.classList.contains('hidden')){
    dynView.classList.add('hidden');
    if(mainGrid) mainGrid.classList.remove('hidden');
  }
}

/* =========================

   Global

========================= */

let currentMode = 'single';

let lastCalculatedIV = 0.2;

let chartInstance = null;



// debounce

let rafPending = false;

function scheduleUpdate(){

  if (rafPending) return;

  rafPending = true;

  requestAnimationFrame(() => {

    rafPending = false;

    updateAll();

  });

}



/* =========================

   Normal PDF/CDF

========================= */

const MathTool = {

  n(x){ return Math.exp(-0.5*x*x)/Math.sqrt(2*Math.PI); },

  N(x){

    let t=1/(1+0.2316419*Math.abs(x));

    let d=0.3989423*Math.exp(-x*x/2);

    let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));

    return x>0?1-p:p;

  }

};



/* =========================

   Black-Scholes

========================= */

function getBS(S, K, T, r, v){

  T = Math.max(1e-8, T);

  v = Math.max(1e-8, v);



  const sqrtT = Math.sqrt(T);

  const d1 = (Math.log(S/K) + (r + 0.5*v*v)*T) / (v*sqrtT);

  const d2 = d1 - v*sqrtT;



  const cp = S*MathTool.N(d1) - K*Math.exp(-r*T)*MathTool.N(d2);

  const pp = cp - S + K*Math.exp(-r*T);



  const nd1 = MathTool.n(d1);



  return {

    call: cp,

    put: pp,

    greeks: {

      delta:{ call: MathTool.N(d1), put: MathTool.N(d1)-1 },

      gamma:{ call: nd1/(S*v*sqrtT), put: nd1/(S*v*sqrtT) },

      vega :{ call: (S*sqrtT*nd1)/100, put: (S*sqrtT*nd1)/100 },

      theta:{

        call:(-(S*nd1*v)/(2*sqrtT) - r*K*Math.exp(-r*T)*MathTool.N(d2))/365,

        put :(-(S*nd1*v)/(2*sqrtT) + r*K*Math.exp(-r*T)*MathTool.N(-d2))/365

      },

      rho:{

        call:(K*T*Math.exp(-r*T)*MathTool.N(d2))/100,

        put :(-K*T*Math.exp(-r*T)*MathTool.N(-d2))/100

      }

    }

  };

}



/* =========================

   DOM helpers

========================= */

function readLeg(idx){

  return {

    idx,

    type: document.getElementById(`L${idx}_type`).value,

    side: document.getElementById(`L${idx}_side`).value,

    qty: +document.getElementById(`L${idx}_qty`).value || 0,

    K: +document.getElementById(`L${idx}_K`).value,

    T: (+document.getElementById(`L${idx}_T`).value)/365,

    sigma: +document.getElementById(`L${idx}_sigma`).value,

    r: +document.getElementById(`L${idx}_r`).value

  };

}

function sideSign(side){ return side === 'long' ? 1 : -1; }



function setLegValues(idx, type, side, K, Tdays, v){

  document.getElementById(`L${idx}_type`).value = type;

  document.getElementById(`L${idx}_side`).value = side;

  document.getElementById(`L${idx}_K`).value = K;

  document.getElementById(`L${idx}_T`).value = Tdays;

  document.getElementById(`L${idx}_sigma`).value = v;

}



/* =========================

   Payoff & Greeks

========================= */

function legPayoffAtExpiry(S, leg, S0){

  const bs0 = getBS(S0, leg.K, leg.T, leg.r, leg.sigma);

  const premium0 = (leg.type === 'call') ? bs0.call : bs0.put;

  const intrinsic = (leg.type === 'call') ? Math.max(0, S - leg.K) : Math.max(0, leg.K - S);

  return leg.qty * (intrinsic - premium0) * sideSign(leg.side);

}

function legGreek(S, leg, greekName){

  const bs = getBS(S, leg.K, leg.T, leg.r, leg.sigma);

  return leg.qty * bs.greeks[greekName][leg.type] * sideSign(leg.side);

}



/* =========================

   IV solver

========================= */

function calculateOnlyIV(){

  const mktP = +document.getElementById('mkt_price').value;

  const leg1 = readLeg(1);

  const S = +document.getElementById('S').value;

  if (leg1.T <= 0 || mktP <= 0 || S <= 0 || leg1.K <= 0) return;



  let v = 0.3;

  for(let i=0;i<25;i++){

    const b = getBS(S, leg1.K, leg1.T, leg1.r, v);

    const modelP = (leg1.type === 'call') ? b.call : b.put;

    const vega_per1vol = b.greeks.vega[leg1.type] * 100;

    const diff = modelP - mktP;



    if (Math.abs(diff) < 1e-6 || Math.abs(vega_per1vol) < 1e-10) break;

    v = v - diff/vega_per1vol;

    v = Math.max(1e-4, Math.min(5, v));

  }



  lastCalculatedIV = v;

  document.getElementById('iv_res').innerText = (v*100).toFixed(2) + "%";

}

function syncIVtoL1Sigma(){

  document.getElementById('L1_sigma').value = lastCalculatedIV.toFixed(4);

  scheduleUpdate();

}



/* =========================

   Robust scale (Quantile)

========================= */

function quantile(arr, q){

  if (!arr.length) return null;

  const a = arr.slice().sort((x,y)=>x-y);

  const pos = (a.length - 1) * q;

  const base = Math.floor(pos);

  const rest = pos - base;

  if (a[base+1] === undefined) return a[base];

  return a[base] + rest * (a[base+1] - a[base]);

}



/* =========================

   Break-even detection

========================= */

function findBreakEvens(xs, ys){

  const bes = [];

  for (let i=1; i<ys.length; i++){

    const y0 = ys[i-1], y1 = ys[i];

    if (!Number.isFinite(y0) || !Number.isFinite(y1)) continue;

    if (y1 === 0) { bes.push(xs[i]); continue; }

    if ((y0 < 0 && y1 > 0) || (y0 > 0 && y1 < 0)){

      const x0 = xs[i-1], x1 = xs[i];

      const t = (0 - y0) / (y1 - y0);

      const xBE = x0 + t * (x1 - x0);

      bes.push(xBE);

    }

  }

  bes.sort((a,b)=>a-b);

  const out = [];

  for (const x of bes){

    if (out.length === 0 || Math.abs(x - out[out.length-1]) > 1e-3) out.push(x);

  }

  return out;

}



/* =========================

   Presets / Mode

========================= */

function setMode(mode){

  /* ✅ only-added: if DynGamma is open, close it when switching back to A modes */
  closeDynGammaIfOpen();

  currentMode = mode;

  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.id==='btn-'+mode));

  const S = +document.getElementById('S').value;



  document.getElementById('leg2_container').classList.toggle('hidden', mode==='single');



  if(mode==='single'){

    setLegValues(1, 'call', 'long', S, 30, 0.25);

  } else if(mode==='straddle'){

    setLegValues(1, 'call', 'long', S, 30, 0.25);

    setLegValues(2, 'put',  'long', S, 30, 0.25);

  } else if(mode==='strangle'){

    setLegValues(1, 'call', 'long', S+5, 30, 0.25);

    setLegValues(2, 'put',  'long', S-5, 30, 0.28);

  } else if(mode==='calendar'){

    setLegValues(1, 'call', 'short', S, 30, 0.25);

    setLegValues(2, 'call', 'long',  S, 60, 0.25);

  } else if(mode==='bull'){

    setLegValues(1, 'call', 'long',  S-5, 30, 0.25);

    setLegValues(2, 'call', 'short', S+5, 30, 0.25);

  } else if(mode==='bear'){

    setLegValues(1, 'call', 'short', S-5, 30, 0.25);

    setLegValues(2, 'call', 'long',  S+5, 30, 0.25);

  }



  calculateOnlyIV();

  scheduleUpdate();

}



/* =========================

   Main calc

========================= */

function updateAll(){

  const S0 = +document.getElementById('S').value;

  const chartType = document.querySelector('input[name="g"]:checked').value;



  const leg1 = readLeg(1);

  const leg2 = readLeg(2);



  const strikes = [leg1.K];

  if(currentMode !== 'single') strikes.push(leg2.K);



  let range = S0 * 0.4;

  const avgK = strikes.reduce((a,b)=>a+b,0)/strikes.length;

  range = Math.max(range, Math.abs(avgK - S0) * 2.5);



  const steps = 200;

  const xMin = Math.max(0.1, S0 - range);

  const xMax = S0 + range;

  const dx = (xMax - xMin) / steps;



  const xs = [];

  const labels = [];

  const dataMain = [];

  const dataL1 = [];

  const dataL2 = [];



  for(let i=0; i<=steps; i++){

    const s = xMin + i*dx;

    xs.push(s);

    labels.push(s.toFixed(2));



    let v1=0, v2=0;



    if (chartType === 'payoff') {

      if (currentMode === 'calendar') {

        const Tn = leg1.T, Tf = leg2.T;

        if (Tf <= Tn + 1e-10) {

          v1 = 0; v2 = 0;

        } else {

          const prem10 = (leg1.type==='call') ? getBS(S0, leg1.K, leg1.T, leg1.r, leg1.sigma).call
                                              : getBS(S0, leg1.K, leg1.T, leg1.r, leg1.sigma).put;

          const prem20 = (leg2.type==='call') ? getBS(S0, leg2.K, leg2.T, leg2.r, leg2.sigma).call
                                              : getBS(S0, leg2.K, leg2.T, leg2.r, leg2.sigma).put;



          const costFV1 = prem10 * Math.exp(leg1.r * Tn);

          const costFV2 = prem20 * Math.exp(leg2.r * Tn);



          const val1 = (leg1.type === 'call') ? Math.max(0, s - leg1.K) : Math.max(0, leg1.K - s);

          v1 = leg1.qty * (val1 - costFV1) * sideSign(leg1.side);



          const bsFar = getBS(s, leg2.K, (Tf - Tn), leg2.r, leg2.sigma);

          const val2 = (leg2.type==='call') ? bsFar.call : bsFar.put;

          v2 = leg2.qty * (val2 - costFV2) * sideSign(leg2.side);

        }

      } else {

        v1 = legPayoffAtExpiry(s, leg1, S0);

        v2 = (currentMode !== 'single') ? legPayoffAtExpiry(s, leg2, S0) : 0;

      }

    } else {

      v1 = legGreek(s, leg1, chartType);

      v2 = (currentMode !== 'single') ? legGreek(s, leg2, chartType) : 0;

    }



    dataL1.push(v1);

    dataL2.push(v2);

    dataMain.push(v1 + v2);

  }



  drawChart(xs, labels, dataMain, dataL1, dataL2, chartType, S0, leg1, leg2);

  updateConsole(leg1, leg2, S0);

}



/* =========================

   Draw

========================= */

function drawChart(xs, labels, main, l1, l2, type, S0, leg1Obj, leg2Obj){

  const canvas = document.getElementById('chart');

  const ctx = canvas.getContext('2d');



  if (chartInstance) chartInstance.destroy();



  // scale pool

  let pool = [];

  if (currentMode === 'single') pool = l1.slice();

  else pool = main.slice();



  // ✅ 修改點：不論 Payoff 還是 Greeks，只要是多腿策略，就把 legs 納入縮放

  if (currentMode !== 'single') pool = pool.concat(l1, l2);

  

  pool = pool.filter(v => Number.isFinite(v));



  let yMin=null, yMax=null;
  if (pool.length > 5) {

    // ====== ✅ 修正：Greeks 在 T 很小時尖峰巨大，quantile 可能裁掉尖峰造成「圖被切掉」
    // 1) 先用 quantile 做穩健縮放（payoff 用 2%~98%，greeks 用更穩健一點）
    const loQ = (type === 'payoff') ? 0.02 : 0.005;
    const hiQ = (type === 'payoff') ? 0.98 : 0.995;

    const qLo = quantile(pool, loQ);
    const qHi = quantile(pool, hiQ);

    let span = (qHi - qLo);
    if (!Number.isFinite(span) || span === 0) span = 1;

    yMin = qLo - span * 0.15;
    yMax = qHi + span * 0.15;

    // 2) ✅ 最重要：保證不裁掉真正極值（Gamma/Theta 等尖峰）
    let pMin = Infinity, pMax = -Infinity;
    for (const v of pool) {
      if (v < pMin) pMin = v;
      if (v > pMax) pMax = v;
    }

    if (Number.isFinite(pMin) && pMin < yMin) {
      const pad = (Math.abs(pMin) || 1) * 0.05;
      yMin = pMin - pad;
    }
    if (Number.isFinite(pMax) && pMax > yMax) {
      const pad = (Math.abs(pMax) || 1) * 0.05;
      yMax = pMax + pad;
    }

    if (!Number.isFinite(yMin) || !Number.isFinite(yMax) || yMin === yMax) {
      yMin = (Number.isFinite(pMin) ? pMin : -1) - 1;
      yMax = (Number.isFinite(pMax) ? pMax :  1) + 1;
    }
    // ====== ✅ 修正結束
  }



  const l1Label = `Leg 1 (${leg1Obj.side} ${leg1Obj.type})`;

  const l2Label = `Leg 2 (${leg2Obj.side} ${leg2Obj.type})`;



  const datasets = [];



  if (currentMode === 'single') {

    const color = (leg1Obj.type === 'call') ? '#4338ca' : '#ef4444';

    datasets.push({

      label: (type === 'payoff') ? 'P/L' : type.toUpperCase(),

      data: l1,

      borderColor: color,

      borderWidth: 3,

      pointRadius: 0,

      fill: (type === 'payoff') ? {target:'origin', above: color+'1A', below: color+'1A'} : false

    });

  } else {

    // total always

    datasets.push({

      label: 'Strategy Total',

      data: main,

      borderColor: '#10b981',

      borderWidth: 3,

      pointRadius: 0,

      fill: (type === 'payoff') ? {target:'origin', above:'rgba(16,185,129,0.12)', below:'rgba(239,68,68,0.12)'} : false,

      order: 1

    });



    // ✅ 修改點：移除 if (type === 'payoff')，Greeks 也能畫出分腿

    datasets.push({

      label: l1Label, data: l1,

      borderColor: '#4338ca', borderWidth: 2, borderDash: [5,5],

      pointRadius: 0, order: 2

    });

    datasets.push({

      label: l2Label, data: l2,

      borderColor: '#ef4444', borderWidth: 2, borderDash: [5,5],

      pointRadius: 0, order: 3

    });

  }



  // annotations

  const annotations = {

    spotLine: { type:'line', xMin:S0, xMax:S0, borderColor:'#fbbf24', borderWidth:2, borderDash:[3,3] }

  };



  if (type === 'payoff') {

    annotations.zeroPL = {

      type:'line',

      yMin:0, yMax:0,

      borderColor:'#94a3b8',

      borderWidth:1.5,

      borderDash:[4,4],

      label:{ content:'P/L = 0', display:true, position:'start', color:'#64748b', backgroundColor:'rgba(255,255,255,0.7)' }

    };



    const baseSeries = (currentMode === 'single') ? l1 : main;

    const bes = findBreakEvens(xs, baseSeries);



    bes.slice(0, 6).forEach((xBE, idx) => {

      const key = `beLine${idx}`;

      annotations[key] = {

        type:'line',

        xMin:xBE, xMax:xBE,

        borderColor:'#d946ef',

        borderWidth:2,

        borderDash:[2,3],

        label:{

          content:`BE ${xBE.toFixed(2)}`,

          display:true,

          position:'end',

          yAdjust:-8,

          color:'#d946ef',

          backgroundColor:'rgba(255,255,255,0.8)'

        }

      };

    });

  }



  chartInstance = new Chart(ctx, {

    type: 'line',

    data: { labels, datasets },

    options: {

      responsive:true,

      maintainAspectRatio:false,

      animation:false,

      scales:{ x:{ ticks:{ maxTicksLimit:10 } }, y:{ min:yMin, max:yMax } },

      plugins:{ legend:{ display:false }, annotation:{ annotations } }

    }

  });



  // header legend

  let html = `<div class="legend-indicator"><div class="line-dashed" style="border-color:#fbbf24"></div> Spot Price</div>`;

  if (type === 'payoff') {

    html += `<div class="legend-indicator"><div class="line-dashed" style="border-color:#94a3b8"></div> P/L = 0</div>`;

    html += `<div class="legend-indicator"><div class="line-dashed" style="border-color:#d946ef"></div> Break-even</div>`;

  }



  if (currentMode === 'single') {

    const color = (leg1Obj.type === 'call') ? '#4338ca' : '#ef4444';

    html += `<div class="legend-indicator"><div class="line-solid" style="background:${color}"></div> ${(type==='payoff')?'P/L':type.toUpperCase()}</div>`;

  } else {

    html += `<div class="legend-indicator"><div class="line-solid" style="background:#10b981"></div> Total</div>`;

    // ✅ Greeks 也要顯示 L1/L2 的圖例

    html += `<div class="legend-indicator"><div class="line-dashed" style="border-color:#4338ca"></div> L1</div>`;

    html += `<div class="legend-indicator"><div class="line-dashed" style="border-color:#ef4444"></div> L2</div>`;

  }

  document.getElementById('chart-header').innerHTML = html;

}



/* =========================

   Console

========================= */

function updateConsole(l1, l2, S0){

  const definitions = {

    'single': '',

    'straddle': '策略定義：同時買進【Call】與【Put】(相同執行價)。預期價格大幅波動。',

    'strangle': '策略定義：買進【Call】(高K) 與【Put】(低K)。成本較跨式低，需更大波動。',

    'calendar': '策略定義：賣出【近月】(L1) 並買進【遠月】(L2)。此圖在「近月到期日 Tn」評價：L1 用到期 intrinsic；L2 用剩餘期限 (Tf−Tn) 的理論價值。',

    'bull': '策略定義：買進低履約價 Call，賣出高履約價 Call。溫和看漲，損益有限。',

    'bear': '策略定義：賣出低履約價 Call，買進高履約價 Call。溫和看跌，損益有限。'

  };



  const defHTML = (currentMode !== 'single') ? `<div class="strat-def-box">${definitions[currentMode] || ''}</div>` : '';



  const bs1 = getBS(S0, l1.K, l1.T, l1.r, l1.sigma);

  const p1 = (l1.type==='call' ? bs1.call : bs1.put);

  const cash1 = p1 * l1.qty * (l1.side==='long' ? -1 : 1);



  let p2 = 0, cash2 = 0;

  if (currentMode !== 'single') {

    const bs2 = getBS(S0, l2.K, l2.T, l2.r, l2.sigma);

    p2 = (l2.type==='call' ? bs2.call : bs2.put);

    cash2 = p2 * l2.qty * (l2.side==='long' ? -1 : 1);

  }



  const net0 = cash1 + cash2;

  const isCredit0 = net0 >= 0;



  function fmtLeg(leg){ return `${leg.side.toUpperCase()} ${leg.type.toUpperCase()} K=${leg.K}, T=${Math.round(leg.T*365)}d`; }



  let extraCalendar = '';

  if (currentMode === 'calendar') {

    const Tn = l1.T;

    const fv1 = (p1 * Math.exp(l1.r * Tn)) * l1.qty * (l1.side==='long' ? -1 : 1);

    const fv2 = (p2 * Math.exp(l2.r * Tn)) * l2.qty * (l2.side==='long' ? -1 : 1);

    const netFV = fv1 + fv2;

    const isCreditFV = netFV >= 0;



    extraCalendar = `

      <div class="data-card" style="border-color:${isCreditFV?'#10b981':'#ef4444'}">

        <div class="dc-label">Net @Tn FV (到近月的成本口徑)</div>

        <div class="dc-val" style="color:${isCreditFV?'#10b981':'#ef4444'}">${Math.abs(netFV).toFixed(2)}</div>

      </div>

    `;

  }



  const cards = `

    <div class="data-card">

      <div class="dc-label">Leg 1 Premium (權利金)</div>

      <div class="dc-val">${p1.toFixed(2)}</div>

      <div class="muted">${fmtLeg(l1)}</div>

    </div>



    ${currentMode!=='single' ? `

    <div class="data-card">

      <div class="dc-label">Leg 2 Premium (權利金)</div>

      <div class="dc-val">${p2.toFixed(2)}</div>

      <div class="muted">${fmtLeg(l2)}</div>

    </div>` : ''}



    <div class="data-card" style="border-color:${isCredit0?'#10b981':'#ef4444'}">

      <div class="dc-label">${isCredit0?'Net Credit (淨收入 t0)':'Net Debit (淨支出 t0)'}</div>

      <div class="dc-val" style="color:${isCredit0?'#10b981':'#ef4444'}">${Math.abs(net0).toFixed(2)}</div>

    </div>



    ${extraCalendar}

  `;



  document.getElementById('strategy-console').innerHTML =

    `<div class="console-title">模式：${currentMode.toUpperCase()}</div>${defHTML}<div class="data-cards">${cards}</div>`;

}



/* =========================

   Boot

========================= */

window.onload = function(){

  try {

    const ann = window.ChartAnnotation || window['chartjs-plugin-annotation'];

    if (ann && window.Chart && Chart.register) Chart.register(ann);

  } catch(e){}



  setTimeout(() => {

    calculateOnlyIV();

    setMode('single');

  }, 0);

};

window.addEventListener('resize', () => { if (chartInstance) chartInstance.resize(); });

/* =========================

========================= */
const MathTool = {
  n(x){ return Math.exp(-0.5*x*x)/Math.sqrt(2*Math.PI); },
  N(x){
    let t=1/(1+0.2316419*Math.abs(x));
    let d=0.3989423*Math.exp(-x*x/2);
    let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
    return x>0?1-p:p;
  }
};

/* =========================
   Cost-of-carry: F = S * exp((r - q)T)
========================= */
function deriveF(S, r, q, T){
  T = Math.max(1e-10, T);
  S = Math.max(1e-12, S);
  return S * Math.exp((r - q) * T);
}

/* =========================
   Black-76 (Options on Futures) + Greeks
========================= */
function black76(F, K, T, r, sigma, type){
  T = Math.max(1e-8, T);
  sigma = Math.max(1e-10, sigma);
  F = Math.max(1e-12, F);
  K = Math.max(1e-12, K);

  const sqrtT = Math.sqrt(T);
  const d1 = (Math.log(F/K) + 0.5*sigma*sigma*T) / (sigma*sqrtT);
  const d2 = d1 - sigma*sqrtT;
  const disc = Math.exp(-r*T);
  const nd1 = MathTool.n(d1);

  let price=0, delta=0;
  if(type === 'call'){
    price = disc * (F*MathTool.N(d1) - K*MathTool.N(d2));
    delta = disc * MathTool.N(d1);
  }else{
    price = disc * (K*MathTool.N(-d2) - F*MathTool.N(-d1));
    delta = disc * (MathTool.N(d1) - 1);
  }

  const gamma = disc * nd1 / (F * sigma * sqrtT);
  const vega  = disc * F * nd1 * sqrtT;
  const theta = (-disc * F * nd1 * sigma / (2*sqrtT) + r*price) / 365;
  const rho = (-T * price) / 100;

  return { price, delta, gamma, vega, theta, rho, d1, d2, disc };
}

/* =========================
   Robust scale (Quantile)
========================= */
function quantile(arr, q){
  if(!arr.length) return null;
  const a = arr.slice().sort((x,y)=>x-y);
  const pos = (a.length - 1) * q;
  const base = Math.floor(pos);
  const rest = pos - base;
  if (a[base+1] === undefined) return a[base];
  return a[base] + rest * (a[base+1] - a[base]);
}

/* =========================
   State / RAF debounce
========================= */
let chart = null;
let rafPending = false;

function scheduleUpdate(fromCarry){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{
    rafPending = false;
    if(fromCarry) syncFIfAuto();
    update();
  });
}

function syncFIfAuto(){
  const auto = document.getElementById('autoF').checked;
  const Finput = document.getElementById('F');
  Finput.disabled = auto;

  if(!auto) return;

  const S = +document.getElementById('S').value;
  const r = +document.getElementById('r').value;
  const q = +document.getElementById('q').value;
  const T = (+document.getElementById('carry_T').value)/365;

  const F = deriveF(S, r, q, T);
  Finput.value = F.toFixed(4);
}

function setActiveBtn(type){
  document.getElementById('btn-long').classList.toggle('active', type==='long');
  document.getElementById('btn-short').classList.toggle('active', type==='short');
}

/* =========================
   Inputs
========================= */
function getInputs(){
  return {
    S: +document.getElementById('S').value,
    r: +document.getElementById('r').value,
    q: +document.getElementById('q').value,
    carryT: (+document.getElementById('carry_T').value)/365,
    F: +document.getElementById('F').value,
    opt: {
      type: document.getElementById('opt_type').value,
      side: document.getElementById('opt_side').value,
      K: +document.getElementById('opt_K').value,
      T: (+document.getElementById('opt_T').value)/365,
      sigma: +document.getElementById('opt_sigma').value,
      qty: +document.getElementById('opt_qty').value
    },
    fut: {
      side: document.getElementById('fut_side').value,
      qty: +document.getElementById('fut_qty').value,
      price: +document.getElementById('fut_price').value
    },
    target: document.querySelector('input[name="g"]:checked')?.value || 'payoff'
  };
}

/* =========================
   Hedge / Strategy
========================= */
function autoHedge(){
  const d = getInputs();

  const b76 = black76(d.F, d.opt.K, d.opt.T, d.r, d.opt.sigma, d.opt.type);
  const optSign = d.opt.side === 'long' ? 1 : -1;
  const optNetDelta = b76.delta * d.opt.qty * optSign;

  const reqFutSignedQty = -optNetDelta;
  const futSide = reqFutSignedQty >= 0 ? 'long' : 'short';
  document.getElementById('fut_side').value = futSide;
  document.getElementById('fut_qty').value = Math.abs(reqFutSignedQty).toFixed(3);

  scheduleUpdate(false);
}

function setStrategy(type){
  setActiveBtn(type);

  const F = +document.getElementById('F').value;

  document.getElementById('opt_type').value = 'call';
  document.getElementById('opt_K').value = F;
  document.getElementById('opt_T').value = 30;
  document.getElementById('opt_qty').value = 1;

  if(type === 'long'){
    document.getElementById('opt_side').value = 'long';
  } else {
    document.getElementById('opt_side').value = 'short';
  }

  const f0El = document.getElementById('fut_price');
  if(!f0El.value || !isFinite(+f0El.value)) f0El.value = F;

  autoHedge();
}

/* =========================
   Update / Plot
========================= */
function update(){
  const d = getInputs();

  const range = Math.max(1, d.F * 0.3);
  const minX = Math.max(0.01, d.F - range);
  const maxX = d.F + range;
  const steps = 160;
  const step = (maxX - minX) / steps;

  let labels = [];
  let dataOpt = [], dataFut = [], dataNet = [];

  const b76_0 = black76(d.F, d.opt.K, d.opt.T, d.r, d.opt.sigma, d.opt.type);
  const optPremium = b76_0.price;

  const optSign = d.opt.side === 'long' ? 1 : -1;
  const futSign = d.fut.side === 'long' ? 1 : -1;

  for(let i=0; i<=steps; i++){
    const Ft = minX + i*step;
    labels.push(Ft.toFixed(2));

    if(d.target === 'payoff'){
      let intrinsic = 0;
      if(d.opt.type === 'call') intrinsic = Math.max(0, Ft - d.opt.K);
      else intrinsic = Math.max(0, d.opt.K - Ft);

      const pnlOpt = (intrinsic - optPremium) * d.opt.qty * optSign;
      const pnlFut = (Ft - d.fut.price) * d.fut.qty * futSign;

      dataOpt.push(pnlOpt);
      dataFut.push(pnlFut);
      dataNet.push(pnlOpt + pnlFut);
    }else{
      const g = black76(Ft, d.opt.K, d.opt.T, d.r, d.opt.sigma, d.opt.type);

      let optVal = 0;
      if(d.target === 'delta') optVal = g.delta;
      else if(d.target === 'gamma') optVal = g.gamma;
      else if(d.target === 'vega') optVal = g.vega/100;
      else if(d.target === 'theta') optVal = g.theta;
      else if(d.target === 'rho') optVal = g.rho;

      optVal = optVal * d.opt.qty * optSign;

      let futVal = 0;
      if(d.target === 'delta') futVal = 1 * d.fut.qty * futSign;

      dataOpt.push(optVal);
      dataFut.push(futVal);
      dataNet.push(optVal + futVal);
    }
  }

  drawChart(labels, dataOpt, dataFut, dataNet, d);
  updateInfo(d, b76_0, optPremium);
}

function updateInfo(d, b76_0, optPremium){
  const optSign = d.opt.side === 'long' ? 1 : -1;
  const futSign = d.fut.side === 'long' ? 1 : -1;

  const optNetDelta = b76_0.delta * d.opt.qty * optSign;
  const futNetDelta = 1 * d.fut.qty * futSign;
  const totalDelta = optNetDelta + futNetDelta;

  const isGammaLong = (d.opt.side === 'long');

  let title = isGammaLong ?
    `<span style="color:#10b981">Long Gamma (做多波動率)</span>` :
    `<span style="color:#ef4444">Short Gamma (做空波動率)</span>`;

  let explanation = isGammaLong ?
    `Black-76 以 <b>期貨 F</b> 為標的：您持有選擇權（正凸性）並用期貨對沖方向（Delta）。獲利來源是<b>大幅波動</b>；代價通常是時間耗損（Theta）。` :
    `Black-76 以 <b>期貨 F</b> 為標的：您賣出選擇權（負凹性）並用期貨對沖方向（Delta）。獲利來源是<b>盤整</b>；風險是大波動時避險追不上而損失擴大。`;

  if (Math.abs(totalDelta) > 0.1) {
    title += ` <span style="font-size:0.8em;color:#f59e0b">(Delta Not Neutral!)</span>`;
  }

  const F_fair = deriveF(d.S, d.r, d.q, d.carryT);

  const optNetGamma = b76_0.gamma * d.opt.qty * optSign;
  const optNetVega  = (b76_0.vega/100) * d.opt.qty * optSign;
  const optNetTheta = b76_0.theta * d.opt.qty * optSign;
  const optNetRho   = b76_0.rho * d.opt.qty * optSign;

  document.getElementById('infoBox').innerHTML = `
    <div class="info-title">${title}</div>
    <div class="info-desc">${explanation}</div>

    <div style="margin-top:10px;font-size:0.85rem;color:#64748b;">
      <span class="math-tag">Opt Δ(F): ${optNetDelta.toFixed(4)}</span> +
      <span class="math-tag">Fut Δ: ${futNetDelta.toFixed(4)}</span> =
      <b>Net Δ: ${totalDelta.toFixed(4)}</b>
    </div>

    <div style="margin-top:10px;font-size:0.82rem;color:#64748b;line-height:1.6;">
      <b>Opt Γ(F):</b> <span class="math-tag">${(Math.abs(optNetGamma) < 1e-6 ? "0" : optNetGamma.toFixed(6))}</span>
      <b style="margin-left:8px;">Vega/1%:</b> <span class="math-tag">${optNetVega.toFixed(4)}</span>
      <b style="margin-left:8px;">Theta/day:</b> <span class="math-tag">${optNetTheta.toFixed(6)}</span>
      <b style="margin-left:8px;">Rho/1%:</b> <span class="math-tag">${optNetRho.toFixed(6)}</span>
    </div>

    <div style="margin-top:10px;font-size:0.82rem;color:#64748b;line-height:1.5;">
      <b>F</b> 用於：選擇權定價 / Greeks（避險）<br>
      <b>F₀</b> 用於：你的期貨實際損益（PnL）<br>
      <span class="math-tag">Opt Premium(t0): ${optPremium.toFixed(4)}</span>
      <span class="math-tag" style="margin-left:6px;">F (now): ${(+d.F).toFixed(4)}</span>
      <span class="math-tag" style="margin-left:6px;">F₀ (entry): ${(+d.fut.price).toFixed(4)}</span>
    </div>

    <div style="margin-top:10px;font-size:0.82rem;color:#64748b;">
      Carry fair value: <b>F* = S·exp((r−q)T)</b> →
      <span class="math-tag">${F_fair.toFixed(4)}</span>
      <span style="margin-left:6px;">(T 取 Carry 區塊的 Days)</span>
    </div>
  `;
}

function drawChart(labels, opt, fut, net, d){
  const ctx = document.getElementById('chart').getContext('2d');
  if(chart) chart.destroy();

  const spotF = d.F;

  const pool = net.concat(opt, fut).filter(v => Number.isFinite(v));
  let yMin = null, yMax = null;
  if(pool.length > 10){
    const q02 = quantile(pool, 0.02);
    const q98 = quantile(pool, 0.98);
    const span = (q98 - q02) || 1;
    yMin = q02 - span*0.15;
    yMax = q98 + span*0.15;
  }

  const titleMap = {
    payoff: 'P/L',
    delta: 'Delta',
    gamma: 'Gamma',
    vega: 'Vega (per 1% vol)',
    theta: 'Theta (per day)',
    rho: 'Rho (per 1%)'
  };

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: `Option ${titleMap[d.target]}`,
          data: opt,
          borderColor: '#d946ef',
          borderWidth: 2,
          borderDash: [5,5],
          pointRadius: 0,
          tension: (d.target==='payoff') ? 0.35 : 0
        },
        {
          label: `Futures ${titleMap[d.target]}`,
          data: fut,
          borderColor: '#f59e0b',
          borderWidth: 2,
          borderDash: [5,5],
          pointRadius: 0,
          tension: 0
        },
        {
          label: `Net ${titleMap[d.target]}`,
          data: net,
          borderColor: '#10b981',
          borderWidth: 4,
          pointRadius: 0,
          fill: (d.target==='payoff')
            ? {target:'origin', above:'rgba(16,185,129,0.1)', below:'rgba(239,68,68,0.1)'}
            : false
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          labels: {
            color: '#94a3b8',
            usePointStyle: true,
            pointStyle: 'line',
            generateLabels(chart){
              const datasets = chart.data.datasets || [];
              return datasets.map((ds, i) => ({
                text: ds.label,
                datasetIndex: i,
                hidden: !chart.isDatasetVisible(i),
                strokeStyle: ds.borderColor,
                lineWidth: ds.borderWidth || 2,
                lineDash: ds.borderDash || [],
                lineDashOffset: ds.borderDashOffset || 0,
                pointStyle: 'line',
                rotation: 0
              }));
            }
          },
          onClick(e, legendItem, legend){
            const i = legendItem.datasetIndex;
            const ci = legend.chart;
            ci.setDatasetVisibility(i, !ci.isDatasetVisible(i));
            ci.update();
          }
        },
        annotation: {
          annotations: {
            spotLine: {
              type: 'line',
              xMin: spotF.toFixed(2),
              xMax: spotF.toFixed(2),
              borderColor: '#fbbf24',
              borderWidth: 2,
              borderDash: [2,2],
              label: { content: 'F (now)', display: true, position: 'start', color: '#fbbf24' }
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#64748b', maxTicksLimit: 8 }, grid: { color: '#e2e8f0' } },
        y: { min: yMin, max: yMax, ticks: { color: '#64748b' }, grid: { color: '#e2e8f0' } }
      }
    }
  });
}

window.addEventListener('load', () => {
  syncFIfAuto();
  setStrategy('long');

  setTimeout(()=>scheduleUpdate(true), 0);
  setTimeout(()=>scheduleUpdate(true), 60);
});
window.addEventListener('resize', ()=>scheduleUpdate(false));
</script>
