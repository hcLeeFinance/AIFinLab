  return OLD_TYPES.includes(type) ? sub : null;

    const r = DATA.recent.house[hkey(state.city, state.dist, t)];
    let yoy = "";
    if (s) {
      // 用季別標籤找去年同季（稀疏行政區會缺季）；最新交易季仍在補登，改用前一個完整季
      const q = DATA.completeQuarter, prevQ = (Number(q.slice(0, 4)) - 1) + q.slice(4);
      const i = s.q.indexOf(q), j = s.q.indexOf(prevQ);
      if (i >= 0 && j >= 0 && s.n[i] >= 5 && s.n[j] >= 5) {
        const pct = (s.med[i] / s.med[j] - 1) * 100;
        yoy = `${q} 較去年同季 ${pct >= 0 ? "+" : ""}${fmt(pct)}%`;
      }
    }
    return `<div class="tile"><div class="k"><span class="dot" style="background:var(${TYPE_VAR[t]})"></span>${t}${subSuffix(state.sub)}・近 4 季中位數</div>
      <div class="v"${r && r.n < 5 ? ' style="color:var(--text-muted)"' : ""}>${r ? fmt(r.med) : "–"}<span style="font-size:13px;font-weight:400;color:var(--text-secondary)"> 萬/坪</span></div>
      <div class="d">${r ? r.n.toLocaleString() + " 筆" + (r.n < 5 ? "・樣本不足，僅供參考" : "") : "無成交"}${yoy ? "・" + yoy : ""}</div></div>`;
  }).join("") + (() => {
    const r = DATA.recent.park[key(state.city, state.dist, "全部")];
    return `<div class="tile"><div class="k"><span class="dot" style="background:var(--neutral)"></span>車位・近 4 季中位數</div>
      <div class="v">${r ? fmt(r.med, 0) : "–"}<span style="font-size:13px;font-weight:400;color:var(--text-secondary)"> 萬/個</span></div>
      <div class="d">${r ? r.n.toLocaleString() + " 個" : "無成交"}</div></div>`;
  })();
}

function renderHouse() {
  const field = state.metric === "中位數" ? "med" : "mean";
  const traces = [], counts = [], thin = [];
  activeTypes().forEach(t => {
    const raw = DATA.house[hkey(state.city, state.dist, t)];
    if (!raw) return;
    const c = clip(raw), s = fillGaps(c), color = css(TYPE_VAR[t]);
    // 每季成交筆數的中位數（沒有成交的季算 0）少於 10 筆，視為樣本少
    const ns = s.n.map(n => n || 0).sort((a, b) => a - b);
    const typical = ns.length ? ns[Math.floor((ns.length - 1) / 2)] : 0;
    if (typical < THIN_N) thin.push({ t, typical });
    if (state.metric === "中位數") {
      // 百分位陰影只畫 ≥5 筆的季，且不插空值（tonexty 遇到空值會填錯區塊）
      const ok = c.n.map((n, i) => (n >= 5 ? i : -1)).filter(i => i >= 0);
      const band = { q: ok.map(i => c.q[i]), p25: ok.map(i => c.p25[i]), p75: ok.map(i => c.p75[i]) };
      traces.push({ x: band.q, y: band.p75, type: "scatter", mode: "lines", line: { width: 0 }, hoverinfo: "skip", showlegend: false, legendgroup: t });
      traces.push({ x: band.q, y: band.p25, type: "scatter", mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: hexA(color, 0.14), hoverinfo: "skip", showlegend: false, legendgroup: t });
    }
    traces.push({
      x: s.q, y: s[field], name: t, legendgroup: t, type: "scatter", mode: "lines+markers",
      line: { color, width: 2 },
      marker: { size: s.n.map(n => n < 5 ? 8 : 5), color: s.n.map(n => n < 5 ? css("--surface-1") : color), line: { color, width: 2 } },
      customdata: s.n.map((n, i) => [n, s.p25[i], s.p75[i]]),
      hovertemplate: `${t}：<b>%{y:.1f}</b> 萬/坪（%{customdata[0]} 筆）<extra></extra>`,
    });
    counts.push({ x: s.q, y: s.n, name: t, type: "bar", marker: { color, line: { color: css("--surface-1"), width: 1 } }, hovertemplate: `${t}：%{y} 筆<extra></extra>`, showlegend: false });
  });
  const proj = thin.filter(x => x.t === "新成屋" || x.t === "預售屋").map(x => x.t);
  document.getElementById("house-warn").textContent = thin.length
    ? `樣本少：${thin.map(x => `${x.t}（${x.typical ? `每季約 ${x.typical} 筆` : "多數季沒有成交"}）`).join("、")}。少量成交的中位數會隨個別物件大幅跳動` +
      (proj.length ? `，${proj.join("、")}的成交又常集中在一兩個建案，走勢主要反映建案地段、坪數的組成變化，不是同樣房子的漲跌` : "") +
      "，請以全市或年度資料為主。"
    : "";
  document.getElementById("t-house").textContent = `${state.city}${state.dist === "全市" ? "（全市）" : state.dist}・房屋單價走勢${subSuffix(state.sub)}`;
  const ps = partialShade();
  const br = activeTypes().includes("預售屋") ? breakMarks(visibleQuarters(), DATA.presaleBreak) : { shapes: [], annotations: [] };
  const ann = [...ps.annotations, ...br.annotations];
  if (!traces.length) ann.push({ xref: "paper", yref: "paper", x: 0.5, y: 0.5, showarrow: false,
    text: activeTypes().length ? "沒有符合條件的成交" : `所選類別沒有「${state.sub}」的細分，請改選類別或細分`, font: { size: 14, color: css("--text-secondary") } });
  Plotly.react("c-house", traces, layoutBase({ xaxis: timeAxis(), yaxis: Object.assign(layoutBase().yaxis, { title: { text: "萬元/坪" }, rangemode: "tozero" }), shapes: [...ps.shapes, ...br.shapes], annotations: ann }), CFG);
  Plotly.react("c-count", counts, layoutBase({ barmode: "stack", bargap: 0.15, xaxis: timeAxis(), yaxis: Object.assign(layoutBase().yaxis, { title: { text: "成交筆數" } }), shapes: [...ps.shapes, ...br.shapes] }), CFG);
}

function renderPark() {
  const field = state.metric === "中位數" ? "med" : "mean";
  const traces = [];
  PARK_ORDER.forEach((c, i) => {
    const raw = DATA.park[key(state.city, state.dist, c)];
    if (!raw) return;
    const s = clip(raw), color = css(PARK_VAR[i]);
    const major = ["坡道平面", "坡道機械", "升降機械"].includes(c);
    traces.push({
      x: s.q, y: s[field], name: c, type: "scatter", mode: "lines+markers", visible: major ? true : "legendonly",
      line: { color, width: 2 }, marker: { size: s.n.map(n => n < 5 ? 8 : 5), color: s.n.map(n => n < 5 ? css("--surface-1") : color), line: { color, width: 2 } },
      customdata: s.n, hovertemplate: `${c}：<b>%{y:.0f}</b> 萬（%{customdata} 個）<extra></extra>`,
    });
  });
  document.getElementById("t-park").textContent = `${state.city}${state.dist === "全市" ? "（全市）" : state.dist}・車位價格走勢`;
  Plotly.react("c-park", traces, layoutBase({ ...partialShade(), xaxis: timeAxis(), yaxis: Object.assign(layoutBase().yaxis, { title: { text: "萬元/個" }, rangemode: "tozero" }) }), CFG);
}

function renderRank() {
  // 細分不適用的類別（如屋齡級距下的預售屋）按鈕停用，並改選第一個可用類別
  const act = applicableTypes();
  if (!act.includes(state.rankType)) state.rankType = act[0];
  document.querySelectorAll("#rank-type button").forEach(b => {
    b.disabled = !act.includes(b.dataset.v);
    b.setAttribute("aria-pressed", b.dataset.v === state.rankType);
  });
  const t = state.rankType, color = css(TYPE_VAR[t]);
  const rows = DATA.districts[state.city].map(d => ({ d, r: DATA.recent.house[hkey(state.city, d, t)] }))
    .filter(x => x.r && x.r.n >= 5).sort((a, b) => a.r.med - b.r.med);
  const cityR = DATA.recent.house[hkey(state.city, "全市", t)];
  document.getElementById("t-rank").textContent = `${state.city}各行政區排名・${t}${subSuffix(state.sub)}`;
  document.getElementById("rank-sub").textContent = `${DATA.recentLabel} 成交單價中位數（萬元/坪），少於 5 筆的行政區不列入。點長條可切換到該行政區。`;
  const shapes = cityR ? [{ type: "line", x0: cityR.med, x1: cityR.med, y0: -0.5, y1: rows.length - 0.5, line: { color: css("--text-muted"), width: 1, dash: "dot" } }] : [];
  const ann = cityR ? [{ x: cityR.med, y: rows.length - 0.5, yanchor: "bottom", text: `全市 ${fmt(cityR.med)}`, showarrow: false, font: { size: 11, color: css("--text-secondary") } }] : [];
  Plotly.react("c-rank", [{
    type: "bar", orientation: "h", y: rows.map(x => x.d), x: rows.map(x => x.r.med),
    marker: { color: rows.map(x => x.d === state.dist ? color : hexA(color, 0.45)), line: { color: css("--surface-1"), width: 1 } },
    text: rows.map(x => fmt(x.r.med)), textposition: "outside", cliponaxis: false,
    textfont: { color: css("--text-secondary") },
    customdata: rows.map(x => x.r.n), hovertemplate: "%{y}：<b>%{x:.1f}</b> 萬/坪（%{customdata} 筆）<extra></extra>",
  }], layoutBase({ hovermode: "closest", margin: { l: 72, r: 48, t: 16, b: 36 }, shapes, annotations: ann,
    xaxis: Object.assign(layoutBase().xaxis, { title: { text: "萬元/坪" }, showspikes: false }),
    yaxis: Object.assign(layoutBase().yaxis, { automargin: true, gridcolor: "rgba(0,0,0,0)" }) }), CFG);
  const el = document.getElementById("c-rank");
  el.removeAllListeners && el.removeAllListeners("plotly_click");
  el.on("plotly_click", ev => {
    state.dist = ev.points[0].y; document.getElementById("dist").value = state.dist; render();
    document.getElementById("c-house").scrollIntoView({ behavior: "smooth", block: "center" });
  });
}

function renderTable() {
  const qs = new Set();
  const get = {};
  activeTypes().forEach(t => { const s = DATA.house[hkey(state.city, state.dist, t)]; if (s) s.q.forEach((q, i) => { qs.add(q); get[t + q] = [s.med[i], s.n[i]]; }); });
  const p = DATA.park[key(state.city, state.dist, "全部")];
  if (p) p.q.forEach((q, i) => { qs.add(q); get["車位" + q] = [p.med[i], p.n[i]]; });
  const cols = [...activeTypes(), "車位"];
  const head = `<tr><th>交易季</th>${cols.map(c => `<th>${c}中位數</th><th>${c}筆數</th>`).join("")}</tr>`;
  const body = [...qs].sort().reverse().map(q => `<tr><td>${q}</td>${cols.map(c => {
    const v = get[c + q]; return `<td>${v ? fmt(v[0], c === "車位" ? 0 : 1) : "–"}</td><td>${v ? v[1] : "–"}</td>`;
  }).join("")}</tr>`).join("");
  document.getElementById("tbl").innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
}

// ---------- 行政區比較 ----------
// 每條線 = 行政區 × 型態；顏色在加入時指定槽位、之後固定（移除別條線不會換色）
const CMP_SLOTS = ["--s1", "--s2", "--s3", "--s4"];
const CMP_TYPES = [...TYPES, "車位"];
const cmp = {
  items: [{ city: "臺北市", dist: "松山區", type: "大樓", sub: "全部", slot: 0 },
          { city: "新北市", dist: "三重區", type: "大樓", sub: "全部", slot: 1 }],
  unit: "year", mode: "price", start: DATA.firstFullYear, end: DATA.lastFullYear,
  pickSub: "全部",
};
const isPark = it => it.type === "車位";
const unitOf = it => (isPark(it) ? "萬元/個" : "萬元/坪");
const cmpLabel = it => `${it.dist === "全市" ? it.city + "（全市）" : it.city.slice(0, 2) + "・" + it.dist}・${it.type}` +
  (isPark(it) ? "" : subSuffix(it.sub));
function cmpSeries(it, unit) {
  if (isPark(it)) return (unit === "year" ? DATA.parkYear : DATA.park)[key(it.city, it.dist, "全部")];
  return (unit === "year" ? DATA.houseYear : DATA.house)[hkey(it.city, it.dist, it.type, it.sub)];
}
// 預售屋的起點年早於實價登錄 2.0 生效的隔年，起終點樣本基礎不同
const breakYear = Number(DATA.presaleBreak.slice(0, 4));
const crossesBreak = it => it.type === "預售屋" && cmp.start <= breakYear;
function yearVal(it, y) {
  const s = cmpSeries(it, "year");
  if (!s) return null;
  const i = s.q.indexOf(String(y));
  return i < 0 ? null : { med: s.med[i], n: s.n[i] };
}
function fillYearSelects() {
  const years = [];
  for (let y = DATA.firstFullYear; y <= DATA.lastFullYear; y++) years.push(y);
  document.getElementById("cmp-start").innerHTML =
    years.slice(0, -1).map(y => `<option ${y === cmp.start ? "selected" : ""}>${y}</option>`).join("");
  document.getElementById("cmp-end").innerHTML =
    years.filter(y => y > cmp.start).map(y => `<option ${y === cmp.end ? "selected" : ""}>${y}</option>`).join("");
}
function setupCompare() {
  const pick = document.getElementById("cmp-pick"), pickType = document.getElementById("cmp-pick-type");
  pick.innerHTML = Object.entries(DATA.districts).map(([c, ds]) =>
    `<optgroup label="${c}">${["全市", ...ds].map(d =>
      `<option value="${c}|${d}">${d === "全市" ? c + "（全市）" : d}</option>`).join("")}</optgroup>`).join("");
  pick.value = "臺北市|大安區";
  pickType.innerHTML = CMP_TYPES.map(t => `<option>${t}</option>`).join("");
  pickType.value = "大樓";  // 之後保留使用者上次選的型態
  const pickSubEl = document.getElementById("cmp-pick-sub");
  const pickSync = () => {
    const t = pickType.value;
    // 換類別後原細分不適用就回到「全部」；車位沒有細分
    if (t !== "車位" && subFor(t, cmp.pickSub) == null) cmp.pickSub = "全部";
    pickSubEl.innerHTML = subOptions(cmp.pickSub, t === "車位" ? null : t);
    pickSubEl.disabled = t === "車位";
  };
  pickSync();
  pickType.onchange = pickSync;
  pickSubEl.onchange = () => { cmp.pickSub = pickSubEl.value; };
  document.getElementById("cmp-add").onclick = () => {
    if (!pick.value) return;
    const [city, dist] = pick.value.split("|");
    const type = pickType.value;
    // 新成屋選「屋齡1–3年」等同全部
    const sub = type === "車位" ? "全部" : subFor(type, cmp.pickSub);
    if (sub == null) return;
    const blocked = () => cmp.items.length >= 4 ||
      cmp.items.some(x => x.city === city && x.dist === dist && x.type === type && x.sub === sub);
    if (blocked()) return;
    withSegments(sub, () => {
      if (blocked()) return;  // 載入期間可能重複點擊
      const used = new Set(cmp.items.map(x => x.slot));
      cmp.items.push({ city, dist, type, sub, slot: [0, 1, 2, 3].find(i => !used.has(i)) });
      renderCompare();
    });
  };
  document.getElementById("cmp-chips").onclick = e => {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    cmp.items.splice(Number(b.dataset.i), 1);
    renderCompare();
  };
  for (const [id, prop] of [["cmp-unit", "unit"], ["cmp-mode", "mode"]]) {
    const seg = document.getElementById(id);
    seg.onclick = e => {
      const b = e.target.closest("button");
      if (!b) return;
      seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      cmp[prop] = b.dataset.v;
      renderCompare();
    };
  }
  document.getElementById("cmp-start").onchange = e => {
    cmp.start = Number(e.target.value);
    if (cmp.end <= cmp.start) cmp.end = cmp.start + 1;
    fillYearSelects();
    renderCompare();
  };
  document.getElementById("cmp-end").onchange = e => { cmp.end = Number(e.target.value); renderCompare(); };
  fillYearSelects();
}

function renderCompare() {
  // 車位（萬元/個）與房屋（萬元/坪）單位不同：單價模式不能共用一條 y 軸，改提示切換到指數
  const units = [...new Set(cmp.items.map(unitOf))];
  const mixedUnits = units.length > 1 && cmp.mode === "price";
  const axisUnit = units.length === 1 ? units[0] : "";
  // 終點選最後完整年度時，順便畫出補登中的最新年度／季（空心點），但不列入期間計算
  const showPartial = cmp.end === DATA.lastFullYear;
  const isPartial = q => Number(q.slice(0, 4)) > DATA.lastFullYear;
  // 空心「補登中」標示：年模式為最後完整年度之後的年；季模式只有 completeQuarter 之後的季（與上方磚塊一致）
  const stillFiling = q => (q.length > 4 ? q > DATA.completeQuarter : isPartial(q));
  const inRange = q => {
    const y = Number(q.slice(0, 4));
    return y >= cmp.start && (y <= cmp.end || (showPartial && isPartial(q)));
  };
  const add = document.getElementById("cmp-add");
  add.disabled = cmp.items.length >= 4;
  add.title = add.disabled ? "最多 4 條線" : "";

  const yrs = cmp.end - cmp.start;
  const traces = [], rows = [];
  cmp.items.forEach(it => {
    const color = css(CMP_SLOTS[it.slot]);
    const s = cmpSeries(it, cmp.unit);
    const b = yearVal(it, cmp.start), e = yearVal(it, cmp.end);
    const baseOk = !!b && b.n >= 5;
    const ok = baseOk && !!e && e.n >= 5;
    rows.push({ it, color, b, e, ok, baseOk,
      total: ok ? (e.med / b.med - 1) * 100 : null,
      cagr: ok ? (Math.pow(e.med / b.med, 1 / yrs) - 1) * 100 : null });
    it.empty = !s;
    // 指數模式：每條線以自己起點年的「年度」中位數為基期（季模式也一樣），基期樣本不足就不畫
    if (!s || mixedUnits || (cmp.mode === "index" && !baseOk)) return;
    const idxs = s.q.map((q, i) => (inRange(q) ? i : -1)).filter(i => i >= 0);
    const xs = idxs.map(i => s.q[i]);
    const ns = idxs.map(i => s.n[i]);
    const hollow = xs.map((q, j) => ns[j] < 5 || stillFiling(q));
    const u = unitOf(it);
    traces.push({
      x: xs,
      y: idxs.map(i => (cmp.mode === "index" ? s.med[i] / b.med * 100 : s.med[i])),
      name: cmpLabel(it), type: "scatter", mode: "lines+markers",
      line: { color, width: 2 },
      marker: { size: hollow.map(h => (h ? 8 : 6)), color: hollow.map(h => (h ? css("--surface-1") : color)), line: { color, width: 2 } },
      customdata: xs.map((q, j) => [ns[j], s.med[idxs[j]], stillFiling(q) ? "（補登中）" : ""]),
      hovertemplate: cmp.mode === "index"
        ? `${cmpLabel(it)}：<b>%{y:.1f}</b>（%{customdata[1]:.1f} ${u}，%{customdata[0]} 筆）%{customdata[2]}<extra></extra>`
        : `${cmpLabel(it)}：<b>%{y:.1f}</b> ${u}（%{customdata[0]} 筆）%{customdata[2]}<extra></extra>`,
    });
  });

  // x 軸：固定類別順序，缺年／缺季仍佔位
  let cats;
  if (cmp.unit === "year") {
    const last = showPartial ? Number(DATA.quarters[DATA.quarters.length - 1].slice(0, 4)) : cmp.end;
    cats = [];
    for (let y = cmp.start; y <= last; y++) cats.push(String(y));
  } else {
    cats = DATA.quarters.filter(inRange);
  }
  const years = cmp.unit === "year" ? cats : cats.filter(q => q.endsWith("Q1"));
  // 窄螢幕每隔幾年標一次，從最後一年往回數，確保最新年份一定有標籤
  const step = document.getElementById("c-cmp").clientWidth < 700 ? Math.ceil(years.length / 6) : 1;
  const ticks = years.filter((q, i) => (years.length - 1 - i) % step === 0);
  const shapes = cmp.mode === "index" && !mixedUnits
    ? [{ type: "line", xref: "paper", x0: 0, x1: 1, y0: 100, y1: 100, line: { color: css("--text-muted"), width: 1, dash: "dot" } }]
    : [];
  const hasPresale = cmp.items.some(it => it.type === "預售屋");
  const br = hasPresale && !mixedUnits ? breakMarks(cats, cmp.unit === "year" ? String(breakYear) : DATA.presaleBreak) : { shapes: [], annotations: [] };
  shapes.push(...br.shapes);
  const narrow = document.getElementById("c-cmp").clientWidth < 700;
  const annotations = mixedUnits ? [{
    xref: "paper", yref: "paper", x: 0.5, y: 0.5, showarrow: false, align: "center",
    text: narrow
      ? "車位（萬元/個）和房屋（萬元/坪）<br>單位不同，無法放在同一張單價圖。<br>請切換到上方的<br>「指數（起點年＝100）」比較漲幅。"
      : "車位（萬元/個）和房屋（萬元/坪）單位不同，無法放在同一張單價圖比較。<br>請切換到上方的「指數（起點年＝100）」比較漲幅。",
    font: { size: narrow ? 12 : 14, color: css("--text-secondary") },
  }] : [...br.annotations];
  Plotly.react("c-cmp", traces, layoutBase({
    shapes, annotations,
    xaxis: Object.assign(layoutBase().xaxis, {
      type: "category", categoryorder: "array", categoryarray: cats, range: [-0.5, cats.length - 0.5],
      tickmode: "array", tickvals: ticks, ticktext: ticks.map(q => q.slice(0, 4)), tickangle: 0,
    }),
    yaxis: Object.assign(layoutBase().yaxis, {
      title: { text: cmp.mode === "index" ? `指數（${cmp.start} 年＝100）` : axisUnit },
      rangemode: cmp.mode === "index" ? "normal" : "tozero",
      showticklabels: !mixedUnits,
    }),
  }), CFG);

  document.getElementById("cmp-chips").innerHTML = cmp.items.map((it, i) =>
    `<span class="chip"><span class="dot" style="background:var(${CMP_SLOTS[it.slot]})"></span>${cmpLabel(it)}` +
    `${it.empty ? ' <span class="muted">無資料</span>' : ""}<button data-i="${i}" aria-label="移除 ${cmpLabel(it)}">×</button></span>`).join("")
    || '<span class="muted">尚未選擇，請從上方加入。</span>';

  const pct = v => (v == null ? "–" : `${v >= 0 ? "+" : ""}${fmt(v)}%`);
  const cell = (it, v) => (v ? `${fmt(v.med, isPark(it) ? 0 : 1)} <span class="muted n">（${v.n} 筆）</span>` +
    (v.n >= 5 && v.n < THIN_YEAR_N ? '<span class="tag">樣本少</span>' : "") : "–");
  const thinRows = rows.filter(r => [r.b, r.e].some(v => v && v.n >= 5 && v.n < THIN_YEAR_N)).map(r => cmpLabel(r.it));
  document.getElementById("cmp-table").innerHTML =
    `<thead><tr><th>比較項目</th><th class="u">單位</th><th>${cmp.start} 年中位數</th><th>${cmp.end} 年中位數</th><th>${yrs} 年總漲幅</th><th>年化報酬率<br><span class="muted">（僅房價）</span></th></tr></thead><tbody>` +
    rows.map(r => `<tr><td><span class="dot" style="background:${r.color}"></span>${cmpLabel(r.it)}<span class="muted um"><br>${unitOf(r.it)}</span></td><td class="muted u">${unitOf(r.it)}</td><td>${cell(r.it, r.b)}</td><td>${cell(r.it, r.e)}</td>` +
      (r.ok ? `<td>${pct(r.total)}${crossesBreak(r.it) ? " †" : ""}</td><td><b>${pct(r.cagr)}</b>${crossesBreak(r.it) ? " †" : ""}</td>`
            : `<td colspan="2" class="muted">樣本不足（起點或終點年少於 5 筆）</td>`) + "</tr>").join("") + "</tbody>";

  const dropped = rows.filter(r => cmp.mode === "index" && !r.baseOk && !r.it.empty).map(r => cmpLabel(r.it));
  document.getElementById("cmp-hint").textContent =
    "年度數值為當年全部成交的中位數。年化報酬率只計房價變動，不含租金收益。" +
    `${DATA.lastFullYear + 1} 年仍在補登，以空心點標示，不列入期間計算。` +
    (dropped.length ? `指數模式下，${dropped.join("、")} 在 ${cmp.start} 年成交少於 5 筆，沒有可靠的基期，未畫出。` : "") +
    (rows.some(r => crossesBreak(r.it))
      ? `† 預售屋在 ${breakYear} 年 7 月實價登錄 2.0 前只有代銷案件、且延後申報，起點年在此之前的漲幅混合了兩種申報制度，僅供參考。` : "") +
    (thinRows.length ? `「樣本少」：${thinRows.join("、")} 的起點或終點年成交少於 ${THIN_YEAR_N} 筆，中位數容易被個別物件或建案左右，漲幅僅供參考。` : "");
}

function syncTypeButtons() {
  const ok = applicableTypes();
  document.querySelectorAll("#types button").forEach(b => {
    b.setAttribute("aria-pressed", state.types.has(b.dataset.v));
    b.disabled = !ok.includes(b.dataset.v);
    b.title = b.disabled ? "目前的細分不適用此類別" : "";
  });
}
function renderMain() { syncTypeButtons(); renderTiles(); renderHouse(); renderRank(); renderTable(); }
function render() { renderMain(); renderPark(); renderCompare(); }

document.getElementById("meta").textContent =
  `資料來源：內政部不動產成交案件實際資訊（實價登錄）・成交日期 ${DATA.quarters[0]}～${DATA.quarters[DATA.quarters.length - 1]}・資料更新至 ${DATA.lastSeason} 期`;
document.getElementById("notes").innerHTML = DATA.notes.map(n => `<li>${n}</li>`).join("");
fillSelectors();
setupCompare();
render();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
</body>
</html>
