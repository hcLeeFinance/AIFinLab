<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinLab - 每日晨報觀盤戰情室</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --nav-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Bar */
        .hub-bar {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .hub-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hub-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-select {
            background: #0f172a;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
        }

        .btn-refresh {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-refresh:hover {
            background: rgba(56, 189, 248, 0.3);
        }

        /* Frame Container */
        .content-frame {
            width: 100%;
            flex-grow: 1;
            border: none;
            min-height: calc(100vh - 60px);
        }
    </style>
</head>
<body>

    <header class="hub-bar">
        <a href="../index.html" class="hub-title">
            <span>📰</span> 每日晨報戰情室
        </a>
        <div class="hub-controls">
            <select id="reportSelector" class="date-select" onchange="loadReport(this.value)">
                <option value="">載入中...</option>
            </select>
            <button class="btn-refresh" onclick="checkLatestReport()">🔄 刷新</button>
        </div>
    </header>

    <iframe id="reportFrame" class="content-frame" src="about:blank"></iframe>

    <script>
        let reportsData = [];

        async function fetchReports() {
            try {
                const res = await fetch('reports.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error('無法載入晨報清單');
                reportsData = await res.json();
                populateSelector();
            } catch (err) {
                console.error(err);
                // Fallback for direct offline / static load
                reportsData = [{ date: '2026-07-24', filename: '2026-07-24.html', title: '最新晨報' }];
                populateSelector();
            }
        }

        function populateSelector() {
            const selector = document.getElementById('reportSelector');
            selector.innerHTML = '';
            
            reportsData.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = item.filename;
                opt.textContent = `${item.date} ${index === 0 ? '(最新)' : ''}`;
                selector.appendChild(opt);
            });

            if (reportsData.length > 0) {
                loadReport(reportsData[0].filename);
            }
        }

        function loadReport(filename) {
            if (!filename) return;
            const frame = document.getElementById('reportFrame');
            frame.src = filename;
        }

        function checkLatestReport() {
            fetchReports();
        }

        // Initial Load
        window.addEventListener('DOMContentLoaded', fetchReports);
    </script>
</body>
</html>
